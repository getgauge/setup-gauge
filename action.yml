name: 'Setup Gauge'
description: 'Setup your Github Actions runner with Gauge CLI'
author: 'BugDiver'
branding:
  icon: 'play'
  color: 'gray-dark'
inputs:
  gauge-version:
    description: 'Version of gauge release, if not entered will use latest.'
    required: false
  gauge-plugins:
    description: 'Plugins needs to be installed along with gauge. if not entered only gauge will be installed'
    required: false
  github-token:
    description: 'Token used to authenticate GitHub API requests when looking up gauge releases. Defaults to the token provided by GitHub Actions to avoid API rate limiting.'
    required: false
    default: ${{ github.token }}
runs:
  using: 'node24'
  main: 'dist/index.js'